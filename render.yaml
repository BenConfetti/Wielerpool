services:
  - type: web
    name: wielerpool-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm run migrate && pnpm run seed && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: wielerpool-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: FRONTEND_ORIGIN
        sync: false
  - type: web
    name: wielerpool-frontend
    runtime: static
    buildCommand: node scripts/build-static.mjs
    staticPublishPath: dist
databases:
  - name: wielerpool-db
    plan: free
    databaseName: wielerpool
    user: wielerpool