services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wielerpool
      POSTGRES_USER: wielerpool
      POSTGRES_PASSWORD: wielerpool
    ports:
      - "5432:5432"
    volumes:
      - wielerpool_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wielerpool -d wielerpool"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  wielerpool_postgres: